  .lhead{padding:16px 18px 14px;border-bottom:2px solid var(--rule);position:relative}

  .origin-note{margin-top:10px;font-size:11.5px;font-weight:700;color:var(--ink);

  .misc{margin-top:10px;font-size:10.5px;color:var(--ink-soft);line-height:1.5;

  .chk{color:#b0561b;font-weight:700}

</style>

<div class="wrap">

function nutBox(n,vol){

  for(const r of n.rows){
    const ind = r[3]?' ind':'';
    html += `<div class="nrow"><span class="nm${ind}">${r[0]}</span><span class="amt">${r[1]}</span><span class="dv">${r[2]||''}</span></div>`;
  }
  html += `<div class="nfoot">${foot}<br>칼슘 ${n.ca} · 칼륨 ${n.k} 별도 강조 가능</div></div>`;
  return html;
}

out += `<div class="note-card">
